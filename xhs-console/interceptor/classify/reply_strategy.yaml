# =====================================================================
# 小红书回复策略库 · 可热编辑(不写代码,直接改这里就能升级)  —— 示例模板
# ------------------------------------------------------------------
# ★ 半开源模板：这里只保留 schema 与代表场景示例记录，真实业务话术不内置。
#   完整策略库（多阶段 × 多来源 × 多人群 × 多情绪的真人话术组）按你的实际业务补全。
# ------------------------------------------------------------------
# 定位:不再是"关键词→1句固定模板"的查表,而是"场景诊断→策略骨架→候选好句组"。
# 与 intent_map.yaml 的分工:
#   intent_map.yaml : 【意图分级】(P0-P3 + action 通道), 该不该回/怎么分流
#   reply_strategy.yaml: 【怎么回】(场景策略 + 可选好句), 回的贴不贴/像不像真人
#
# 核心逻辑:
#   收到留言 → 诊断器给出 5 信号(意图/阶段/来源/人群/情绪)
#   → 策略命中器按 【阶段 × 来源 × 人群 × 情绪】查表 → 拿到该场景的
#     「策略骨架(tone/目标/禁忌)」+「候选好句组(多句真人话)」
#   → LLM 适配层把 骨架+好句+对方原话 组合润色成那句回复
#     (无 LLM 时用候选好句直接按场景拼接, 规则兜底)
# =====================================================================

meta:
  version: "0.2"
  updated: "YYYY-MM-DD"
  note: >-
    第2版: 强化"私信报价引导"与"阶段精准"。依据《交易导流违规管理细则》(2025-03-12)+2026《社区规范》:
    ★私信里报课程价合规(用户已授权明示), 但绝不出现旧价/任务单价/堆全部档;
    ★私信里也禁 微信/手机号/扫码/谐音变体; 引导加微属违规, 只能让用户主动或走专业号小卡片/留资卡;
    ★公开区评论区最严, 只种草/提问, 绝不导流/卖课/留价/留联系方式(由 compose_reply 的 public 通道把关)。
    ★对方已"能接单/线下/约时间"直接收线给下一步, 别绕回问背景。

# =====================================================================
# 维度定义
# =====================================================================
# 阶段 stage       : 对方处对话哪一步
#   first_ask   首问模糊   → 先自我介绍+确认对方身份, 别急着喂干货
#   confirm     背景确认   → 接住对方情况, 针对性给切入
#   value_承接   想深入/想要 → 给价值, 引出下一步
#   quote       报价/问钱   → 分两种: 问课程价 vs 问任务单价!
#   hesitant    犹豫/权衡   → 先共情, 不逼单, 给确定性
#   act         促单/约见   → 给线下/明确的下一步, 收线
#
# 来源 source      : 对方从哪来(决定切入角度)
#   opc_recruit   OPC招募笔记   → 往"OPC承接/接单"引导
#   xueyan_ai     研学AI笔记     → 往"研学AI落地"引导
#   tool_public   通用工具/干货笔记 → 往"工具效率/干货"引导
#   comment       评论区来的     → 先确认是评论转化, 话术更具信任
#   dm_unknown    直接私信(无来源) → 认不出哪篇, 先确认需求
#   lead_routing  导流/联系方式触达 → 高价值承接技巧
#
# 人群 persona     : 对方是谁(决定口吻/叫法/给什么)
#   instigator    讲师/团队   → 平等合作口吻, 讲"一起做", 给BD通道
#   guide         研学导游/地接 → 同行情切口吻, 讲"你的场景/带团痛点"
#   newbie        零基础小白  → 安抚口吻, 讲"带你做/有人带"
#   operator      打工运营/自媒体人 → 效率口吻, 讲"提效/省时间"
#
# 情绪 mood        : 对方情绪基调(决定共情前面还是给方案前)
#   anxious / hesitant / eager / polite / guarded
# =====================================================================

# =====================================================================
# 策略条目: 按 【阶段 + 来源 + 人群】 组织, 情绪在 tone 里带出
# 每条: tone(说话基调) / goal(这一句要达到什么) / taboos(禁区) / lines(候选好句≥2)
# =====================================================================
strategies:

  # ---------- 阶段1示例: 首问模糊 (对方刚开口, 还不知道你说啥) ----------
  first_ask__any__any:
    tone: "先接住对方的问题, 用一句话说清'你是谁/在干嘛', 再问一句对方情况。别急着喂干货。"
    goal: "让对方知道你不是机器人, 同时摸到对方的身份/需求来定后续话术。"
    taboos: ["别长篇自我介绍成'我们团队是...'", "别一上来就报价", "别反问一堆问题像查户口"]
    lines:
      - "看您问这个, 我大概说下我在做什么——我这边是带着做 AI 落地实操的, 主要面向做研学/带团/想用AI提效的伙伴。您是已经在做这块, 还是在了解入门?"
      - "好问题。我做的是把 AI 用进实际业务里(不是讲理论), 目前服务比较多的是研学/带团这类的从业者。方便说下您现在的情况吗?"
      - "一句话说, 我是带人用 AI 把活儿干得省事、还能接到单的那种, 专做研学/带团/内容这几块。您现在是遇到什么卡点了, 还是单纯想了解下?"

  # ---------- 阶段4示例: 报价/问钱 (最容易翻车, 必须分两种!) ----------
  quote__any__any__course_price:
    tone: "对方问的是【课程/初阶班】价格 → 报起价, 但要有上下文, 别干巴巴报价。"
    goal: "给出课程价格的同时, 引导对方对基础、降低'贵'的感知; 避免答错题(问课程价就别扯任务单)。"
    taboos: ["别同时堆4档价", "别出现旧价", "别写死任务单价", "别只报一个价不解释值在哪"]
    lines:
      - "咱们初阶班是 1499 起(早鸟有优惠), 主要教研学导游/地接的 AI 落地实操, 不堆理论、一步步带着做。想先问下您是想学 AI 还是已经在研学这块想升级?"
      - "这个价是初阶班 1499 起, 含的内容就是研学/带团里能立刻上手的 AI 实操——排线、写内容、做获客那几块, 都是您能直接带回自己工作里的。"

  quote__any__any__task_price:
    tone: "对方问的是【任务单价/接单价格】(如'多少钱一单') → 这是承接模式的价格, 不是课程价! 先确认, 再解释。"
    goal: "分清楚对方问的是'单任务多少钱'还是'课程多少钱', 别答错题; 且不写死具体单价避免触红线。"
    taboos: ["【最重要】别把'任务单价'答成'课程价'!", "别写死具体任务单价触红线", "别轻飘飘承诺接单"]
    lines:
      - "您问的是'接一单能拿多少'对吧? 这个得看单子类型, 不是一个固定数——有按条算的也有按项目算的。您是想了解接单这块的模式, 还是想学怎么用AI去做单?"

  # ---------- 阶段7示例: 导流/联系方式触达 (最值钱场景, 专属桶) ----------
  lead_routing__any__any:
    tone: "对方要么'主动求联'要么'含蓄递联系方式'。先接住'你要联系我'这个真实需求, 再给一条【不违规的承接路径】, 绝不当场甩微信/扫码。"
    goal: "既把'对方要联系方式'这个真实商机接住、推向下一步, 又不踩导流红线(私信禁微信/扫码/谐音, 公开区最严)。"
    taboos:
      - "【红线】主动甩微信/手机号/二维码/谐音变体(绿泡泡/VX/薇)→ 私信公开区都禁"
      - "【红线】评论区'私信我/加我/看主页领'→ 诱导导流, 触发《交易导流违规》加重处罚"
      - "【红线】绝不用'扣1/私信我/主页领取'这类诱导话术"
    lines:
      - "您想直接联系上我啊, 那简单。我平时主要在小红书这边, 您先点上关注、或者看下我主页置顶——那篇里把我现在在做的和怎么对接都写清楚了, 您看一下就知道该不该往下走。"
      - "行, 这个咱不着急, 先把方向对了再说。您要是想持续跟进我发的研学/带团AI那套, 可以先关注 + 看我置顶那篇, 里面我写清了适合谁的; 您觉得对得上再联系。"

# =====================================================================
# 来源→切入角度 映射(策略命中器用, 快速给不同来源定基调)
# =====================================================================
source_angle:
  opc_recruit: "OPC承接/接单方向"
  xueyan_ai: "研学AI落地方向"
  ai_training: "AI技能培训/认证方向"
  tool_public: "工具效率/干货方向"
  comment: "评论转化, 已有信任基础"
  dm_unknown: "无来源, 先确认需求"
  lead_routing: "导流/联系方式触达, 高价值承接技巧"
