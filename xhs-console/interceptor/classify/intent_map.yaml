# 意图库 - 小红书留言意图分级(可热编辑,不写代码)
# ------------------------------------------------------------------
# ★ 半开源模板：这里只保留 schema 与示例记录，请按你的实际业务改写。
#   完整业务意图（真实人群关键词/话术/客户名）不内置，详见 README 合规说明。
# ------------------------------------------------------------------
# 规则:
#   keywords  : 命中即判为该意图(优先序越靠前越先命中)
#   tier      : P0=强商机要约 / P1=明确意向可转化 / P2=一般需求模板 / P3=弱意向/可忽略/防骚扰
#   action    : 发送分层(见通道)  auto=(纯模板可真自动白名单)  human=(需真人的关键回复)  ignore=不回/标记
#   draft     : 建议首拟稿;  处为待填,采集后由 classify 按命中关键词/模板合成
intent:
  - name: "P0示例-高意向商机/合作要约"       # 最高优先:直接能合作 → 人工 BD,不自动发料
    tier: P0
    action: human
    keywords: ["我们团队","能合作吗","招讲师","加入你们","合伙","能聊聊合作"]
    note: "命中=高意向商机,采集后须人工第一时间跟进;不得用机械模板压"
    draft: "收到,关于讲师/团队合作这块咱们线下细聊更有效率——您方便的话我同学长先跟您约个时间?"
  - name: "P1示例-明确咨询课程/价格"          # 直接问多少钱/什么班/怎么报名 → 软引导
    tier: P1
    action: human                # 含价,须真人 → 软引导(价格如实报,不堆档)
    keywords: ["多少钱","价格","收费","费用","怎么报名","报名","课程报名","学什么"]
    draft: "咱们初阶班是 1499 起(早鸟有优惠)。内容主要面向研学导游/地接的 AI 落地实操,不堆理论,每一步带着做。您是想学 AI 还是已经在做研学这块想升级?"
  - name: "P2示例-求模板/扣关键词/要资料"      # 低风险内容请求权 → 直转化(白名单可真自动)
    tier: P2
    action: auto                 # 纯模板,风控宽松通道
    keywords: ["求模板","模板","资料","领","口诀","关键词","课件","发我一份"]
    note: "这类给『自动回复模板』即可——命中即触发 auto 通道话术,不涉价、不涉人际接洽"
    draft: "好的,资料我整理好了~ 先把最核心的那份发您。您想先要哪块——研学/带团的AI落地,还是通用提效模板?我按您需要的给。"
  - name: "P3示例-无效/广告/无关/纯表情"       # 安全忽略:纯推销/远离主题/表情图片
    tier: P3
    action: ignore
    keywords: ["代发","点赞互","互粉","招代理","办理证书","绿泡泡","ks"]
    note: "命中即不回(防骚扰/防批量引流话术)。顺带把对端主动群发式 B2B 推销/纯表情/图片整档丢 P3"
  - name: "其他/待分类"
    tier: P3
    action: human
    keywords: []
    note: "未命中以上 → 待人工归类(先不自动),采集器只落库"
