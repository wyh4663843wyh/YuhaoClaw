<svg viewBox="0 0 680 480" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>单条发布 5 步闭环流程图</title>
<desc>INFO→CLICK→WAIT→TYPE+point→INFO verify 的 GELab-Zero 闭环动作链</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  .t { font: 500 14px system-ui, -apple-system, sans-serif; fill: #222; }
  .th { font: 500 14px system-ui, -apple-system, sans-serif; fill: #222; }
  .ts { font: 400 12px system-ui, -apple-system, sans-serif; fill: #555; }
  .arr { stroke: #555; stroke-width: 1.5; fill: none; }
  rect { stroke-width: 0.5; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue text { fill: #0C447C; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal text { fill: #085041; }
  .c-amber rect { fill: #FAEEDA; stroke: #BA7517; }
  .c-amber text { fill: #633806; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral text { fill: #4A1B0C; }
  .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green text { fill: #173404; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple text { fill: #26215C; }
</style>

<text class="t" x="340" y="28" text-anchor="middle">单条发布 5 步闭环动作链</text>

<g class="c-blue">
<rect x="60" y="60" width="160" height="80" rx="12"/>
<text class="th" x="140" y="84" text-anchor="middle">STEP 1 · INFO</text>
<text class="ts" x="140" y="103" text-anchor="middle">截屏 + UI dump</text>
<text class="ts" x="140" y="118" text-anchor="middle">识别 EditText 坐标</text>
</g>

<line class="arr" x1="225" y1="100" x2="265" y2="100" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="270" y="60" width="160" height="80" rx="12"/>
<text class="th" x="350" y="84" text-anchor="middle">STEP 2 · CLICK</text>
<text class="ts" x="350" y="103" text-anchor="middle">点击 EditText 中心</text>
<text class="ts" x="350" y="118" text-anchor="middle">±3px 抖动模拟真人</text>
</g>

<line class="arr" x1="435" y1="100" x2="475" y2="100" marker-end="url(#arrow)"/>

<g class="c-amber">
<rect x="480" y="60" width="140" height="80" rx="12"/>
<text class="th" x="550" y="84" text-anchor="middle">STEP 3 · WAIT</text>
<text class="ts" x="550" y="103" text-anchor="middle">等 1-2 秒</text>
<text class="ts" x="550" y="118" text-anchor="middle">键盘完全弹出</text>
</g>

<line class="arr" x1="550" y1="145" x2="550" y2="175" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="440" y="180" width="180" height="80" rx="12"/>
<text class="th" x="530" y="204" text-anchor="middle">STEP 4 · TYPE + point</text>
<text class="ts" x="530" y="223" text-anchor="middle">yadb 输入文本</text>
<text class="ts" x="530" y="238" text-anchor="middle">同时传 point 锁定焦点</text>
</g>

<line class="arr" x1="435" y1="220" x2="265" y2="220" marker-end="url(#arrow)"/>

<g class="c-green">
<rect x="60" y="180" width="180" height="80" rx="12"/>
<text class="th" x="150" y="204" text-anchor="middle">STEP 5 · INFO 校验</text>
<text class="ts" x="150" y="223" text-anchor="middle">重新截屏看 EditText</text>
<text class="ts" x="150" y="238" text-anchor="middle">确认文本已输入</text>
</g>

<line class="arr" x1="60" y1="100" x2="60" y2="380" stroke-dasharray="3 3"/>
<line class="arr" x1="60" y1="380" x2="240" y2="380" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="240" y="360" width="180" height="44" rx="8"/>
<text class="th" x="330" y="380" text-anchor="middle">异常分支 → ABORT + 重试</text>
<text class="ts" x="330" y="396" text-anchor="middle">max_steps = 40 步上限</text>
</g>

<line class="arr" x1="150" y1="265" x2="150" y2="340" marker-end="url(#arrow)"/>

<text class="ts" x="340" y="430" text-anchor="middle">关键：每个 STEP 完成后必须回到 INFO 校验，避免「盲打」累积错误</text>
<text class="ts" x="340" y="450" text-anchor="middle">5 步走完 = 一段内容输入完成 → 接着走加话题、加地点、发布</text>
</svg>