<svg viewBox="0 0 680 420" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>WorkBuddy safe-delete 拦截路径与修复对比</title>
<desc>左：未修复路径（卡在 node guard 阈值） 右：修复路径（跳过 sitecustomize）</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  .t { font: 500 14px system-ui, -apple-system, sans-serif; fill: #222; }
  .th { font: 500 14px system-ui, -apple-system, sans-serif; fill: #222; }
  .ts { font: 400 12px system-ui, -apple-system, sans-serif; fill: #555; }
  .arr { stroke: #555; stroke-width: 1.5; fill: none; }
  rect { stroke-width: 0.5; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue text { fill: #0C447C; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal text { fill: #085041; }
  .c-amber rect { fill: #FAEEDA; stroke: #BA7517; }
  .c-amber text { fill: #633806; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral text { fill: #4A1B0C; }
  .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green text { fill: #173404; }
  .c-red rect { fill: #FCEBEB; stroke: #A32D2D; }
  .c-red text { fill: #501313; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple text { fill: #26215C; }
  .box rect { fill: #fff; stroke: #aaa; }
  .box text { fill: #333; }
</style>

<text class="t" x="340" y="28" text-anchor="middle">safe-delete 拦截与修复对比</text>

<text class="th" x="170" y="60" text-anchor="middle" fill="#A32D2D">修复前（卡死）</text>
<text class="th" x="510" y="60" text-anchor="middle" fill="#3B6D11">修复后（通畅）</text>

<g class="box">
<rect x="40" y="80" width="260" height="36" rx="8"/>
<text class="ts" x="170" y="102" text-anchor="middle">publisher.py 调 smart_remove</text>
</g>
<g class="box">
<rect x="380" y="80" width="260" height="36" rx="8"/>
<text class="ts" x="510" y="102" text-anchor="middle">publisher.py 调 smart_remove</text>
</g>

<g class="box">
<rect x="40" y="130" width="260" height="36" rx="8"/>
<text class="ts" x="170" y="152" text-anchor="middle">sitecustomize.py 拦截</text>
</g>
<g class="box">
<rect x="380" y="130" width="260" height="36" rx="8"/>
<text class="ts" x="510" y="152" text-anchor="middle">sitecustomize.py 拦截</text>
</g>

<line class="arr" x1="170" y1="116" x2="170" y2="130" marker-end="url(#arrow)"/>
<line class="arr" x1="510" y1="116" x2="510" y2="130" marker-end="url(#arrow)"/>

<g class="c-red">
<rect x="40" y="180" width="260" height="44" rx="8"/>
<text class="ts" x="170" y="200" text-anchor="middle">检查 CODEBUDDY_SAFE_DELETE_*</text>
<text class="ts" x="170" y="215" text-anchor="middle">环境变量存在 → 调 node guard</text>
</g>
<g class="c-green">
<rect x="380" y="180" width="260" height="44" rx="8"/>
<text class="ts" x="510" y="200" text-anchor="middle">检查 CODEBUDDY_SAFE_DELETE_*</text>
<text class="ts" x="510" y="215" text-anchor="middle">已被 publisher.py 清空</text>
</g>

<line class="arr" x1="170" y1="166" x2="170" y2="180" marker-end="url(#arrow)"/>
<line class="arr" x1="510" y1="166" x2="510" y2="180" marker-end="url(#arrow)"/>

<g class="c-red">
<rect x="40" y="238" width="260" height="36" rx="8"/>
<text class="ts" x="170" y="260" text-anchor="middle">node 子进程数 count_targets</text>
</g>
<g class="c-green">
<rect x="380" y="238" width="260" height="36" rx="8"/>
<text class="ts" x="510" y="260" text-anchor="middle">sitecustomize:339 直接 return</text>
</g>

<line class="arr" x1="170" y1="224" x2="170" y2="238" marker-end="url(#arrow)"/>
<line class="arr" x1="510" y1="224" x2="510" y2="238" marker-end="url(#arrow)"/>

<g class="c-red">
<rect x="40" y="288" width="260" height="50" rx="8"/>
<text class="ts" x="170" y="308" text-anchor="middle">state.json count ≥ 50</text>
<text class="ts" x="170" y="323" text-anchor="middle">→ SAFE_DELETE_BULK_CONFIRM</text>
</g>
<g class="c-green">
<rect x="380" y="288" width="260" height="50" rx="8"/>
<text class="ts" x="510" y="308" text-anchor="middle">直接调 _platform_trash</text>
<text class="ts" x="510" y="323" text-anchor="middle">→ os.remove 走平台回收站</text>
</g>

<line class="arr" x1="170" y1="274" x2="170" y2="288" marker-end="url(#arrow)"/>
<line class="arr" x1="510" y1="274" x2="510" y2="288" marker-end="url(#arrow)"/>

<g class="c-red">
<rect x="40" y="352" width="260" height="50" rx="8"/>
<text class="th" x="170" y="372" text-anchor="middle">失败 → agent 死循环</text>
<text class="ts" x="170" y="388" text-anchor="middle">20 分钟 timeout 退出</text>
</g>
<g class="c-green">
<rect x="380" y="352" width="260" height="50" rx="8"/>
<text class="th" x="510" y="372" text-anchor="middle">单轮 7-10 分钟完成</text>
<text class="ts" x="510" y="388" text-anchor="middle">连续 5 轮全成功</text>
</g>

<line class="arr" x1="170" y1="338" x2="170" y2="352" marker-end="url(#arrow)"/>
<line class="arr" x1="510" y1="338" x2="510" y2="352" marker-end="url(#arrow)"/>

<text class="ts" x="340" y="416" text-anchor="middle">修复点：publisher.py 启动子进程时清掉 4 个 env 变量（详见 §6.4）</text>
</svg>