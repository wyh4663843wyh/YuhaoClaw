<svg viewBox="0 0 680 540" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>多轮调度器状态机</title>
<desc>_scheduler_Xr.py 调度循环 + safe-delete 修复 + 7 分钟超时监控</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  .t { font: 500 14px system-ui, -apple-system, sans-serif; fill: #222; }
  .th { font: 500 14px system-ui, -apple-system, sans-serif; fill: #222; }
  .ts { font: 400 12px system-ui, -apple-system, sans-serif; fill: #555; }
  .arr { stroke: #555; stroke-width: 1.5; fill: none; }
  rect { stroke-width: 0.5; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal text { fill: #085041; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue text { fill: #0C447C; }
  .c-amber rect { fill: #FAEEDA; stroke: #BA7517; }
  .c-amber text { fill: #633806; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral text { fill: #4A1B0C; }
  .c-red rect { fill: #FCEBEB; stroke: #A32D2D; }
  .c-red text { fill: #501313; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple text { fill: #26215C; }
  .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green text { fill: #173404; }
</style>

<text class="t" x="340" y="28" text-anchor="middle">多轮调度器状态机（_scheduler_Xr.py）</text>

<g class="c-teal">
<rect x="240" y="55" width="200" height="50" rx="10"/>
<text class="th" x="340" y="78" text-anchor="middle">START</text>
<text class="ts" x="340" y="93" text-anchor="middle">创建锁文件 + 启动</text>
</g>

<line class="arr" x1="340" y1="108" x2="340" y2="135" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="240" y="140" width="200" height="55" rx="10"/>
<text class="th" x="340" y="163" text-anchor="middle">P1 · 准备</text>
<text class="ts" x="340" y="180" text-anchor="middle">清截图 + 清 safe-delete env</text>
</g>

<line class="arr" x1="340" y1="200" x2="340" y2="225" marker-end="url(#arrow)"/>

<g class="c-amber">
<rect x="240" y="230" width="200" height="60" rx="10"/>
<text class="th" x="340" y="253" text-anchor="middle">P2 · 跑 R_i</text>
<text class="ts" x="340" y="270" text-anchor="middle">subprocess.run publisher.py</text>
<text class="ts" x="340" y="283" text-anchor="middle">7 分钟超时监控</text>
</g>

<line class="arr" x1="445" y1="260" x2="495" y2="260" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="500" y="230" width="140" height="60" rx="10"/>
<text class="th" x="570" y="253" text-anchor="middle">卡死判定</text>
<text class="ts" x="570" y="270" text-anchor="middle">单轮 &gt; 7min</text>
<text class="ts" x="570" y="283" text-anchor="middle">→ 杀进程</text>
</g>

<line class="arr" x1="240" y1="260" x2="120" y2="260" marker-end="url(#arrow)"/>
<line class="arr" x1="120" y1="260" x2="120" y2="380"/>
<line class="arr" x1="120" y1="380" x2="240" y2="380" marker-end="url(#arrow)"/>

<g class="c-red">
<rect x="240" y="350" width="200" height="60" rx="10"/>
<text class="th" x="340" y="373" text-anchor="middle">P3 · sleep</text>
<text class="ts" x="340" y="390" text-anchor="middle">间隔 M 分钟（15/30/40）</text>
<text class="ts" x="340" y="403" text-anchor="middle">检查锁文件 → 没了就停</text>
</g>

<line class="arr" x1="340" y1="295" x2="340" y2="345" marker-end="url(#arrow)"/>

<line class="arr" x1="445" y1="380" x2="540" y2="380" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="540" y="350" width="100" height="60" rx="10"/>
<text class="th" x="590" y="373" text-anchor="middle">R+1</text>
<text class="ts" x="590" y="388" text-anchor="middle">下一轮</text>
</g>

<line class="arr" x1="590" y1="345" x2="590" y2="295" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<line class="arr" x1="340" y1="415" x2="340" y2="450" marker-end="url(#arrow)"/>

<g class="c-green">
<rect x="240" y="455" width="200" height="50" rx="10"/>
<text class="th" x="340" y="478" text-anchor="middle">END</text>
<text class="ts" x="340" y="493" text-anchor="middle">rounds 跑完 / 锁没了</text>
</g>

<text class="ts" x="120" y="225" text-anchor="middle">失败</text>
<text class="ts" x="500" y="220" text-anchor="middle">卡死</text>
</svg>